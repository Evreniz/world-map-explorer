<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Terrain Atlas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <div class="brand-wrap"><span class="brand-icon">🌍</span><strong class="brand">Terrain Atlas</strong></div>
        <nav class="top-actions">
          <button id="focusWorldBtn" class="top-btn"><i class="fa-solid fa-globe"></i> Dünya</button>
          <button id="saveBtn" class="top-btn"><i class="fa-solid fa-floppy-disk"></i> Kaydet</button>
          <button id="continueBtn" class="top-btn"><i class="fa-solid fa-rotate-right"></i> Kaldığım yer</button>
        </nav>
      </header>

      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <h2>Kontrol Merkezi</h2>
          <button id="closeBtn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <section class="side-section">
          <h3>Harita Görünümü</h3>
          <div class="view-grid">
            <button class="view-btn active" data-view="global">🌍 Dünya</button>
            <button class="view-btn" data-view="terrain">🏔️ Topografya</button>
            <button class="view-btn" data-view="geology">🪨 Jeoloji</button>
          </div>
        </section>

        <section class="side-section">
          <h3>Katmanlar</h3>
          <label class="toggle"><input type="checkbox" data-layer="cities" checked /> Şehirler</label>
          <label class="toggle"><input type="checkbox" data-layer="mountains" checked /> Zirveler</label>
          <label class="toggle"><input type="checkbox" data-layer="geologyLayer" checked /> Jeolojik Alanlar</label>
          <label class="toggle"><input type="checkbox" data-layer="faultsLayer" checked /> Fay Hatları</label>
        </section>

        <section class="side-section">
          <h3>Arama</h3>
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchInput" type="text" placeholder="Bölge, kaynak veya şehir..." />
          </div>
        </section>

        <section class="side-section">
          <h3>Analiz</h3>
          <div id="regionSummary" class="region-summary"></div>
          <div id="metrics" class="metrics"></div>
        </section>
      </aside>

      <div id="overlay"></div>
      <main class="workspace">
        <div id="map"></div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
