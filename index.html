<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Terrain Atlas 3D</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css" />
    <style>
      html, body, #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, 'Segoe UI', sans-serif;
        background: #07131e;
      }

      #app {
        position: relative;
      }

      #cesiumContainer {
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
      }

      .panel {
        background: rgba(10, 20, 30, 0.72);
        border: 1px solid rgba(120, 180, 255, 0.28);
        border-radius: 16px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(10px);
        pointer-events: auto;
      }

      .title-box {
        padding: 12px 16px;
      }

      .title-box h1 {
        margin: 0 0 6px;
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        color: #effcff;
      }

      .title-box span {
        color: #9dcfff;
        font-size: 0.78rem;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 8px;
      }

      .tool-btn {
        border: 1px solid rgba(144, 199, 255, 0.2);
        background: rgba(18, 35, 49, 0.82);
        color: #effcff;
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
      }

      .tool-btn:hover {
        background: rgba(30, 58, 75, 0.9);
      }

      .searchbox {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        width: min(360px, 80vw);
      }

      .searchbox input {
        background: transparent;
        border: none;
        outline: none;
        width: 100%;
        color: white;
        font-size: 0.95rem;
      }

      .searchbox i {
        color: #8cc8ff;
      }

      .info-box {
        position: absolute;
        right: 20px;
        bottom: 20px;
        width: min(320px, 32vw);
        padding: 14px 16px;
        z-index: 10;
        pointer-events: auto;
      }

      .info-box h2 {
        margin: 0 0 8px;
        font-size: 1rem;
        color: #edfaff;
      }

      .info-box p {
        margin: 6px 0;
        color: #dfefff;
        line-height: 1.5;
        font-size: 0.86rem;
      }

      .legend {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.72rem;
        color: #dfefff;
      }

      .dot {
        width: 10px;
        height: 10px;
        display: inline-block;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="cesiumContainer"></div>

      <div class="hud">
        <div>
          <div class="panel title-box">
            <h1>Terrain Atlas 3D</h1>
            <span>Asya · Avrupa · Dünya</span>
          </div>

          <div class="panel searchbox">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchInput" type="text" placeholder="Şehir, bölge veya ülke ara..." />
          </div>
        </div>

        <div class="panel toolbar">
          <button class="tool-btn" id="btnWorld">🌍 Dünya</button>
          <button class="tool-btn" id="btnEurasia">🌏 Asya/Avrupa</button>
          <button class="tool-btn" id="btnCities">🏙️ Şehirler</button>
          <button class="tool-btn" id="btnReset">🔄 Reset</button>
        </div>
      </div>

      <aside class="panel info-box">
        <h2>Harita Özeti</h2>
        <p id="regionSummary">Avrupa ve Asya sınırları, şehir etiketleri ve 3D arazi görünümü aktif.</p>
        <div class="legend">
          <span><i class="dot" style="background:#4ec5ff"></i> Şehir</span>
          <span><i class="dot" style="background:#7cf7d1"></i> Bölge</span>
          <span><i class="dot" style="background:#ffb066"></i> Risk</span>
        </div>
      </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
