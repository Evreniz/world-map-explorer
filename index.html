<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain Atlas</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwUEQ1Y1iwG5l3Jg4e4rFhCkx7qWq0NAmw2kNQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menüyü aç">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h1>🗺️ Terrain Atlas</h1>
          <button class="close-btn" id="closeBtn" aria-label="Menüyü kapat">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="sidebar-content">
          <div class="section">
            <h2>📍 Haritalar</h2>
            <div class="map-selector">
              <button class="map-btn active" data-map="global">🌍 Dünya</button>
              <button class="map-btn" data-map="tectonic">⚡ Tektonik</button>
              <button class="map-btn" data-map="geology">🪨 Jeoloji</button>
              <button class="map-btn" data-map="underground">🔍 Yeraltı</button>
              <button class="map-btn" data-map="terrain">🏔️ Topografya</button>
            </div>
          </div>

          <div class="section">
            <label for="baseLayerSelect">📺 Harita Görünümü</label>
            <select id="baseLayerSelect">
              <option value="satellite">🛰️ Uydu</option>
              <option value="topo">🗻 Topografya</option>
              <option value="dark">🌙 Koyu Dünya</option>
            </select>
          </div>

          <div class="section">
            <h3>🎨 Katmanlar</h3>
            <div class="layer-toggles">
              <label><input type="checkbox" data-layer="terrain" checked /> 🏞️ Arazi</label>
              <label><input type="checkbox" data-layer="cities" checked /> 🏙️ Şehirler</label>
              <label><input type="checkbox" data-layer="mountains" checked /> ⛰️ Zirveler</label>
              <label><input type="checkbox" data-layer="geology" checked /> 🪨 Jeoloji</label>
              <label><input type="checkbox" data-layer="faults" checked /> ⚡ Fay Hatları</label>
              <label><input type="checkbox" data-layer="underground" checked /> 🔍 Yeraltı</label>
              <label><input type="checkbox" data-layer="custom" /> 📌 Özel Katmanlar</label>
            </div>
          </div>

          <div class="section">
            <label for="elevationRange">📊 Yükseklik</label>
            <input id="elevationRange" type="range" min="0" max="100" value="72" />
            <small id="elevationValue">72%</small>
          </div>

          <div class="section">
            <h3>🎯 Bölgeler</h3>
            <div class="focus-buttons">
              <button id="focusGlobal">🌎 Dünya</button>
              <button id="focusAlps">🏔️ Alpler</button>
              <button id="focusAndes">⛰️ Andes</button>
              <button id="focusHimalaya">🏔️ Himalaya</button>
            </div>
          </div>

          <div class="section">
            <h3>📁 Dosya Yükleme</h3>
            <div class="file-upload">
              <input type="file" id="fileUpload" accept=".kmz,.kml,.geojson,.json" />
              <label for="fileUpload" class="file-label">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                KML/KMZ/GeoJSON Yükle
              </label>
              <div id="uploadStatus" class="upload-status"></div>
            </div>
          </div>

          <div class="section">
            <h3>💾 İndir</h3>
            <div class="download-buttons">
              <button id="downloadGeoJSON">📥 GeoJSON</button>
              <button id="downloadKML">📥 KML</button>
              <button id="downloadData">📥 Tüm Veri</button>
            </div>
          </div>

          <div class="info-box">
            <strong>ℹ️ Bilgi</strong>
            <p>
              Haritada yer üstü ve yer altı verileri aynı anda görünür. KML/KMZ veya GeoJSON dosyalarını ekleyerek özel katman oluşturabilirsin.
            </p>
          </div>
        </div>
      </aside>

      <div class="overlay" id="overlay"></div>

      <main class="main-content">
        <div id="map" class="map-container"></div>
        <div class="map-title" id="mapTitle">🌍 Dünya Haritası</div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
